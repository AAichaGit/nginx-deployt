argoproj.io/v1alpha1
kind: Application
metadata:
  name: myapp-argo-application
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ebonje/2028.git
    targetRevision: main
    path: "2028"
  destination:
    server: https://kubernetes.default.svc
    namespace: default  # Changed to 'default' namespace
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
